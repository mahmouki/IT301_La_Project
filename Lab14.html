<body>

        console.log(checkgrade) */ 
const site ='https://randomuser.me/api/';

let cardDiv = document.createElement('div');
cardDiv.className = 'profile-card';

let img = document.createElement('img');
let bttn = document.createElement('button');
bttn.type = 'button';
bttn.textContent = 'Generate Profile'; 
let form = document.createElement('form');
form.action = '#';
form.appendChild(bttn);
document.body.appendChild(form);

let nameP = document.createElement('p');
let emailP = document.createElement('p');
let phoneP = document.createElement('p');

const getImg = async()=>{
    try{
        let response = await fetch(site); 
        if (!response.ok) {throw new Error('Response Status')}; 
        
        let result = await response.json(); 
        let user = result.results[0]; 

        img.src = user.picture.large; 
        img.alt = 'User Profile';
        nameP.textContent = `Name: ${user.name.first} ${user.name.last}`;
        emailP.textContent = `Email: ${user.email}`;
        phoneP.textContent = `Phone: ${user.phone}`;
        
        cardDiv.appendChild(img);
        cardDiv.appendChild(nameP);
        cardDiv.appendChild(emailP);
        cardDiv.appendChild(phoneP);
        document.body.appendChild(cardDiv);

    }catch(reason){ console.log(reason); }} 
    bttn.addEventListener('click', getImg);

    </script>
