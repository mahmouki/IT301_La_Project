<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            margin: 0
        }
        #flex_parent{
            width: 100vw;
            height: 100vw;
    
            border: 1px solid;
            display: flex;
            justify-content:space-evenly;
            align-items: center;
            flex-direction: row;
            flex-wrap: wrap;
            

        }

        img{
            align-items: flex-end;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <div id="flex_parent">
        <img src="https://picsum.photos/100/100?random=3" alt="Random image">
        <img src="https://picsum.photos/200/200?random=1" alt="Random image">
        <img src="https://picsum.photos/100/100?random=2" alt="Random image">
    </div>

    
</body>
</html>
