<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let allPosts = [];
        const site = "Https://jsonplaceholder.typicode.com/posts";
        function clearArticles() {
            document.querySelectorAll('article').forEach((article) => {
                article.remove();



            });

        }

        function displayPosts(posts) {
            clearArticles();
            posts.forEach(post => {
            const article=document.createElement('article');
            const h2=document.createElement('h2');
            h2.textContent = post.title;
            const p=document.createElement('p');
            p.textContent = post.body
            article.appendChild(h2);
            article.appendChild(p);
            document.body.appendChild(article);
            });
        }

        const getPost = async()=>{
            try{
                let response = await fetch(site);
                if (!response.ok) {throw new Error('Response Status')};

                let result = await response.json();
                allPosts = result;

                displayPosts(allPosts);
                console.table(allPosts);
                    
            } catch (error) {
                console.error('Error fetching data', error);    


            }
        };

    const disBttn = document.getElementById('displayUserBtn');
const userss = document.getElementById('displayUserID'); 

disBttn.addEventListener('click', () => {
    const selecter = userss.value;
    if (selecter === "") return;

    console.log("Selected User ID from input:", selecter);
    
    const filteredPosts = allPosts.filter(post => post.userId === Number(selecter));
    
    console.table(filteredPosts);
    displayPosts(filteredPosts);
});

        


        const filBtn = document.getElementById('filterBtn')
        const dropdown = document.getElementById('userID')
        filBtn.addEventListener('click', ()=>{
            const selected = dropdown.value;
            if (selected === "") return;
        

        console.log("Selected Element", selected);
        const filteredPosts = allPosts.filter(post => post.userId === Number(selected));
        console.table(filteredPosts);
        displayPosts(filteredPosts);

        
    
        });

     const daBttn = document.getElementById('findBtn');
    const users = document.getElementById('postID'); 

    daBttn.addEventListener('click', () => {
    const selectee = users.value;
    if (selectee === "") return;

    console.log("Selected Post ID from input:", selectee);
    
    const filteredPosts = allPosts.filter(post => post.id === Number(selectee));
    
    console.table(filteredPosts);
    displayPosts(filteredPosts);
});

getPost()

    
    

    </script>

</body>
</html>
